name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Tauri crate embeds the built frontend at compile time.
      - run: npm ci && npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  imap-integration:
    name: IMAP/SMTP integration (GreenMail)
    runs-on: ubuntu-24.04
    services:
      greenmail:
        image: greenmail/standalone:2.1.14
        env:
          # The image's defaults minus `greenmail.auth.disabled`, so that wrong
          # passwords are rejected.
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.all
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=alice:secret@example.com,bob:secret@example.com
        ports:
          - 3025:3025
          - 3143:3143
          - 3993:3993
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for GreenMail
        run: |
          for _ in $(seq 1 60); do
            (exec 3<>/dev/tcp/127.0.0.1/3143) 2>/dev/null && exit 0
            sleep 1
          done
          echo "GreenMail did not start" >&2
          exit 1
      - name: Run integration tests
        run: cargo test -p cumulas-core --test imap_integration --locked -- --nocapture
        env:
          CUMULAS_TEST_IMAP: "1"
          # GreenMail's self-signed certificate must be refused.
          CUMULAS_TEST_UNTRUSTED_TLS_PORT: "3993"

  flatpak-sources:
    name: Flatpak offline sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate offline Cargo and npm sources
        run: |
          git clone --depth 1 https://github.com/flatpak/flatpak-builder-tools /tmp/flatpak-builder-tools
          python -m pip install aiohttp tomlkit /tmp/flatpak-builder-tools/node
          FLATPAK_BUILDER_TOOLS=/tmp/flatpak-builder-tools packaging/flatpak/generate-sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-sources
          path: packaging/flatpak/*-sources.json

  flatpak:
    name: Flatpak build
    needs: flatpak-sources
    runs-on: ubuntu-24.04
    steps:
      # The GNOME SDK, the Rust and Node extensions and a release build of the
      # app need more disk than the runner has free by default.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-sources
          path: packaging/flatpak
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu 24.04 restricts the unprivileged user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --repo=repo build-dir packaging/flatpak/co.cumulas.Mail.yml 2>&1 | tee flatpak-build.log
          flatpak build-bundle repo cumulas-mail.flatpak co.cumulas.Mail
          df -h /
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatpak
          path: |
            cumulas-mail.flatpak
            flatpak-build.log
          if-no-files-found: ignore

  desktop-e2e:
    name: Desktop end-to-end (tauri-driver + GreenMail)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev \
            webkit2gtk-driver xvfb gnome-keyring libsecret-tools dbus-x11 openjdk-21-jre-headless
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: cargo install tauri-driver --locked
      - run: python -m pip install -r e2e/desktop/requirements.txt
      - run: e2e/desktop/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-screenshots
          path: e2e/.output/desktop/
