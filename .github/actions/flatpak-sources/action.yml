name: Generate Flatpak sources
description: >-
  Writes packaging/flatpak/cargo-sources.json and node-sources.json, the
  offline Cargo and npm sources Flatpak builds need, with
  flatpak-builder-tools at the commit generate-sources.sh pins and the Python
  packages requirements.txt pins, with their hashes. Shared by ci.yml and
  flatpak-repo.yml.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.13"
    - name: Generate offline Cargo and npm sources
      shell: bash
      env:
        REQUIREMENTS: ${{ github.action_path }}/requirements.txt
      run: |
        python3 -m pip install --require-hashes --only-binary :all: -r "$REQUIREMENTS"
        FLATPAK_BUILDER_TOOLS="$RUNNER_TEMP/flatpak-builder-tools" packaging/flatpak/generate-sources.sh
