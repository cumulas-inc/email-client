name: Set up Flatpak
description: >-
  Installs Flatpak and flatpak-builder (and any other packages asked for),
  lets bubblewrap create user namespaces, and adds Flathub to the user
  installation. Shared by ci.yml and flatpak-repo.yml.
inputs:
  free-disk-space:
    description: Remove preinstalled toolchains first, to make room for the SDK and a release build.
    default: "true"
  packages:
    description: More Ubuntu packages to install.
    default: ""
runs:
  using: composite
  steps:
    # The GNOME SDK, the Rust and Node extensions and a release build of the
    # app need more disk than the runner has free by default.
    - name: Free disk space
      if: inputs.free-disk-space == 'true'
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        sudo docker image prune --all --force >/dev/null || true
        df -h /
    - name: Install Flatpak tooling
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        sudo apt-get update
        # shellcheck disable=SC2086 # A list of package names.
        sudo apt-get install -y flatpak flatpak-builder $PACKAGES
        # Ubuntu 24.04 restricts the unprivileged user namespaces bubblewrap needs.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
