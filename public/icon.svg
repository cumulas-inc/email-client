<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128">
  <title>Cumulas Mail</title>
  <!-- The Cumulas mark (src/app/LogoMark.tsx): a teal cloud in front of a paler one.
       Each cloud has a darker 4-unit bottom edge for depth; the front one has a rim light. -->
  <defs>
    <path id="back" d="M70.51 71.01A14.59 14.59 0 0 1 58.63 47.96A22.92 22.92 0 1 1 101.72 35.63A17.19 17.19 0 0 1 120 52.78L120 56.43A14.59 14.59 0 0 1 105.41 71.01Z"/>
    <path id="front" d="M8 89.25L8 73.62A22.92 22.92 0 0 1 28.63 50.81A31.26 31.26 0 0 1 90.3 57.5A20.32 20.32 0 0 1 109.58 77.79L109.58 89.25A18.75 18.75 0 0 1 90.83 108L26.75 108A18.75 18.75 0 0 1 8 89.25Z"/>
    <linearGradient id="back-face" x1="0" y1="14.23" x2="0" y2="71.01" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a3e0d7"/>
      <stop offset="1" stop-color="#8acfc5"/>
    </linearGradient>
    <linearGradient id="front-face" x1="0" y1="26.73" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#169a91"/>
      <stop offset="1" stop-color="#0a6c67"/>
    </linearGradient>
    <clipPath id="front-clip">
      <use xlink:href="#front"/>
    </clipPath>
  </defs>
  <use xlink:href="#back" y="4" fill="#5ea99f"/>
  <use xlink:href="#back" fill="url(#back-face)"/>
  <use xlink:href="#front" y="4" fill="#075954"/>
  <g clip-path="url(#front-clip)">
    <use xlink:href="#front" fill="#2fa79d"/>
    <use xlink:href="#front" y="1.75" fill="url(#front-face)"/>
  </g>
</svg>
