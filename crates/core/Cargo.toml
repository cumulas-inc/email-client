[package]
name = "cumulas-core"
description = "Accounts, sync, storage and protocol providers (Microsoft Graph, IMAP/SMTP) for Cumulas Mail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cumulas_core"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

# Storage
rusqlite = { version = "0.40", features = ["bundled"] }

# HTTP / Microsoft Graph / OAuth
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls", "http2", "charset", "gzip"] }
sha2 = "0.10"
rand = "0.9"
# The computer's time zone, when the mailbox's can't be read
iana-time-zone = "0.1"

# Push: cancellation for the per-account watchers, TCP keepalive on IMAP sockets
tokio-util = "0.7"
socket2 = "0.6"

# IMAP / SMTP / MIME
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
# Named directly to pick the `ring` provider explicitly: with both ring and
# aws-lc-rs compiled in, rustls has no default provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier", "hostname"] }
mail-parser = "0.11"

# HTML sanitizing for message bodies
ammonia = "4"

# Search queries: composing typed text (NFC) and telling combining marks
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
icu_properties = "2"

# Secrets (Secret Service / Flatpak secret portal)
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { workspace = true, features = ["test-util"] }
